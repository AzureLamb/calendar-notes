<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet">
    <script src="index.js"></script>
</head>
<body>
    <div id="calendar-block">
        <div id="calendar-nav-bar">
            <button id="past-month-button"><</button>
            <div id="calendar-title">September 2026</div>
            <button id="future-month-button">></button>
        </div>
        <div class="calendar-content-behavior">
            <div class="calendar-day">Sun</div>
            <div class="calendar-day">Mon</div>
            <div class="calendar-day">Tue</div>
            <div class="calendar-day">Thu</div>
            <div class="calendar-day">Wed</div>
            <div class="calendar-day">Fri</div>
            <div class="calendar-day">Sat</div>
        </div>
        <div class="calendar-content-behavior" id="calendar-content">
        </div>
        <hr>
        <div class="calendar-content-behavior">
            <div class="calendar-day" id = "not-assigned">Na</div>
        </div>
    </div>

    <div id="text-edit-block">
        <textarea id="text-edit-area"></textarea>
    </div>

</body>
</html>
